<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a18" />
      <stop offset="100%" stop-color="#020205" />
    </linearGradient>

    <!-- Brand Neon Gradient -->
    <linearGradient id="dfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd" />
      <stop offset="30%" stop-color="#8a2be2" />
      <stop offset="70%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#00ffff" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2be2" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00ffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0.6" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="256" r="160" fill="#8a2be2" opacity="0.12" filter="url(#neonGlow)" />

  <!-- Monogram DF Group Centered -->
  <g fill="url(#dfGrad)" transform="translate(10, 0)">
    <!-- Letter D -->
    <path d="M 85 130 
             L 195 130 
             C 260 130 295 170 295 256 
             C 295 342 260 382 195 382 
             L 85 382 
             Z 
             M 147 186 
             L 147 326 
             L 189 326 
             C 225 326 237 300 237 256 
             C 237 212 225 186 189 186 
             Z" />

    <!-- Letter F -->
    <path d="M 320 130 
             L 425 130 
             L 425 186 
             L 378 186 
             L 378 230 
             L 418 230 
             L 418 284 
             L 378 284 
             L 378 382 
             L 320 382 
             Z" />
  </g>
</svg>
